<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style.css" />
    <title>Kontaktformular</title>
  </head>
  <body>
    <p><a href="/Webp1/Tag03/index.html">Zur Startseite</a></p>
    <h1>Kontaktformular</h1>

    <form action="">
      <fieldset>
        <legend>Deine Angaben</legend>
        <label for="anrede">Anrede:</label>
        <select name="anrede" id="anrede">
          <option value="auswahl">Bitte wählen</option>
          <option value="frau">Frau</option>
          <option value="herr">Herr</option>
          <option value="divers">Divers</option>
        </select>
        <br />
        <p>Account anlegen?</p>
        <input type="radio" name="account" id="ja" value="ja" />
        <label for="ja">Ja</label>
        <input type="radio" name="account" id="nein" value="nein" checked />
        <label for="nein">Nein</label>
        <br />
        <p>Newsletter?</p>
        <input type="checkbox" name="newsletter" id="ja" value="ja" />
        <label for="ja">Abonnieren</label>
        <br />
        <label for="vorname">Vorname:</label>
        <input
          type="text"
          id="vorname"
          name="vorname"
          style="margin-top: 24px"
        />
        <br />
        <label for="email">E-Mail:</label>
        <input type="email" id="email" name="email" required />
        <br />
        <label for="pw">Passwort:</label>
        <input type="password" id="pw" name="password" />
        <br />
        <label for="nachricht">Nachricht:</label>
        <textarea name="nachricht" id="nachricht" rows="4" cols="30"></textarea>
      </fieldset>
    </form>
  </body>
</html>
